<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greenhouse Universal Application</title>
</head>
<body>
  <div id="wrapper">
    <div id="main">
      <div id="content">
        <h1>Senior Software Engineer at Acme Corp</h1>
        <form id="application_form" action="/apply" method="post" enctype="multipart/form-data">
          <div class="field">
            <label for="first_name">First Name <span class="asterisk">*</span></label>
            <input type="text" id="first_name" name="job_application[first_name]" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="last_name">Last Name <span class="asterisk">*</span></label>
            <input type="text" id="last_name" name="job_application[last_name]" autocomplete="family-name" required>
          </div>
          <div class="field">
            <label for="email">Email <span class="asterisk">*</span></label>
            <input type="email" id="email" name="job_application[email]" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="phone">Phone <span class="asterisk">*</span></label>
            <input type="tel" id="phone" name="job_application[phone]" autocomplete="tel" required>
          </div>
          <div class="field">
            <label for="resume">Resume/CV <span class="asterisk">*</span></label>
            <input type="file" id="resume" name="resume" required>
          </div>
          <div class="field">
            <label for="job_application_answers_attributes_0_text_value">LinkedIn Profile</label>
            <input type="text" id="job_application_answers_attributes_0_text_value" name="job_application[answers_attributes][0][text_value]">
          </div>
          <div class="field">
            <label for="job_application_answers_attributes_1_text_value">Website</label>
            <input type="text" id="job_application_answers_attributes_1_text_value" name="job_application[answers_attributes][1][text_value]">
          </div>
          <div class="field">
            <label for="job_application_answers_attributes_2_text_value">GitHub</label>
            <input type="text" id="job_application_answers_attributes_2_text_value" name="job_application[answers_attributes][2][text_value]">
          </div>
          <div class="field">
            <label for="job_application_answers_attributes_3_text_value">Other Website</label>
            <input type="text" id="job_application_answers_attributes_3_text_value" name="job_application[answers_attributes][3][text_value]">
          </div>
          <div class="field">
            <label for="custom_q">What is your favorite testing framework?</label>
            <textarea id="custom_q" name="job_application[answers_attributes][4][text_value]"></textarea>
          </div>
          <div class="field">
            <label>
              <input type="checkbox" id="consent" name="consent" value="true">
              I acknowledge that Acme Corp may process my data for recruitment purposes.
            </label>
          </div>
          <div class="actions">
            <input type="submit" id="submit_app" value="Submit Application">
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
